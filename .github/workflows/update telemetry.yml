name: Update telemetry

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets/telemetry.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          if [ -f ".github/scripts/telemetry.py" ]; then
            python .github/scripts/telemetry.py
          elif [ -f "assets/telemetry.py" ]; then
            mkdir -p .github/scripts
            cp assets/telemetry.py .github/scripts/telemetry.py
            python .github/scripts/telemetry.py
          else
            echo "telemetry.py not found in repository"
            find . -maxdepth 3 -name "telemetry.py"
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          git diff --cached --quiet || (git commit -m "chore: update telemetry" && git push)
