<svg xmlns="http://www.w3.org/2000/svg" width="408" height="310" viewBox="0 0 408 310" role="img" aria-label="Auto-RAG Agent: Self-correcting LangGraph pipeline. Grades retrieved documents for relevance, rewrites the query when context falls short, and checks every answer against the retrieved context before it ships." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="408" height="310" fill="#1a1c1a"/><rect x="0.5" y="0.5" width="407" height="309" rx="8" fill="#1a1c1a" stroke="#2a2d2a"/><path d="M0.5 34 V8.5 a8 8 0 0 1 8 -8 H399.5 a8 8 0 0 1 8 8 V34 Z" fill="#151615"/><line x1="0" x2="408" y1="34" y2="34" stroke="#2a2d2a"/><circle cx="20" cy="17" r="5" fill="#d38d8d"/><circle cx="38" cy="17" r="5" fill="#d3b58d"/><circle cx="56" cy="17" r="5" fill="#a3b68a"/><text x="204.0" y="21" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="12" fill="#5c6356">~/projects/rag-agent</text><g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace"><text x="22" y="72" font-size="17" fill="#e6e6e6"><tspan fill="#5c6356"># </tspan>Auto-RAG Agent</text><text x="22" y="100" font-size="12" fill="#a3b68a">Self-correcting LangGraph pipeline. Grades</text><text x="22" y="119" font-size="12" fill="#a3b68a">retrieved documents for relevance, rewrites the</text><text x="22" y="138" font-size="12" fill="#a3b68a">query when context falls short, and checks every</text><text x="22" y="157" font-size="12" fill="#a3b68a">answer against the retrieved context before it</text><text x="22" y="176" font-size="12" fill="#a3b68a">ships.</text><rect x="22" y="210" width="117" height="24" rx="4" fill="#2a261f" stroke="#d3b58d" stroke-opacity=".7"/><text x="80" y="226" font-size="11" text-anchor="middle" fill="#d3b58d">self-correcting</text><rect x="147" y="210" width="143" height="24" rx="4" fill="#2a261f" stroke="#d3b58d" stroke-opa