<svg xmlns="http://www.w3.org/2000/svg" width="408" height="310" viewBox="0 0 408 310" role="img" aria-label="RiskReveal Scanner: Risk-prioritization engine that correlates 3+ security feeds, de-duplicates overlapping findings and scores what is left by actual risk. Async workers keep the interface responsive." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="408" height="310" fill="#1a1c1a"/><rect x="0.5" y="0.5" width="407" height="309" rx="8" fill="#1a1c1a" stroke="#2a2d2a"/><path d="M0.5 34 V8.5 a8 8 0 0 1 8 -8 H399.5 a8 8 0 0 1 8 8 V34 Z" fill="#151615"/><line x1="0" x2="408" y1="34" y2="34" stroke="#2a2d2a"/><circle cx="20" cy="17" r="5" fill="#d38d8d"/><circle cx="38" cy="17" r="5" fill="#d3b58d"/><circle cx="56" cy="17" r="5" fill="#a3b68a"/><text x="204.0" y="21" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="12" fill="#5c6356">~/projects/vuln-scanner</text><g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace"><text x="22" y="72" font-size="17" fill="#e6e6e6"><tspan fill="#5c6356"># </tspan>RiskReveal Scanner</text><text x="22" y="100" font-size="12" fill="#a3b68a">Risk-prioritization engine that correlates 3+</text><text x="22" y="119" font-size="12" fill="#a3b68a">security feeds, de-duplicates overlapping findings</text><text x="22" y="138" font-size="12" fill="#a3b68a">and scores what is left by actual risk. Async</text><text x="22" y="157" font-size="12" fill="#a3b68a">workers keep the interface responsive.</text><rect x="22" y="210" width="71" height="24" rx="4" fill="#2a261f" stroke="#d3b58d" stroke-opacity=".7"/><text x="57" y="226" font-size="11" text-anchor="middle" fill="#d3b58d">3+ feeds</text><rect x="101" y="210" width="117" height="24" rx="4" fill="#2a261f" stroke="#d3b58d" stroke-opacity=".7"/><text x="159" y="226" font-size="11" text-anchor="middle" fill="#d3b58d">~90% less noise</text><rect x="226" y="210" width="51" height="24" rx="4" fill="#2a261f" stroke="#d3b58d" stroke-opacity=".7"/><text x="251" y="226" font-size="11" text-anchor="middle" fill="#d3b58d">async</text><rect x="22" y="242" width="51" height="24" rx="4" fill="#1f2724" stroke="#8ab6a3" stroke-opacity=".7"/><text x="48" y="258" font-size="11" text-anchor="middle" fill="#8ab6a3">Flask</text><rect x="81" y="242" width="64" height="24" rx="4" fill="#1f2724" stroke="#8ab6a3" stroke-opacity=".7"/><text x="113" y="258" font-size="11" text-anchor="middle" fill="#8ab6a3">Next.js</text><rect x="153" y="242" width="58" height="24" rx="4" fill="#1f2724" stroke="#8ab6a3" stroke-opacity=".7"/><text x="182" y="258" font-size="11" text-anchor="middle" fill="#8ab6a3">Celery</text><rect x="219" y="242" width="51" height="24" rx="4" fill="#1f2724" stroke="#8ab6a3" stroke-opacity=".7"/><text x="244" y="258" font-size="11" text-anchor="middle" fill="#8ab6a3">Redis</text><line x1="22" x2="386" y1="268" y2="268" stroke="#2a2d2a"/><text x="22" y="288" font-size="12" fill="#d3b58d">view source -&gt;</text><rect x="130" y="277" width="6.1" height="14" fill="#d3b58d"><animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/></rect></g><rect x="1" y="34" width="406" height="2" fill="#8ab6a3" fill-opacity=".12"><animate attributeName="y" dur="5s" repeatCount="indefinite" values="34;307;34" keyTimes="0;.5;1"/></rect><rect x="0.5" y="0.5" width="407" height="309" rx="8" fill="none" stroke="#8ab6a3" stroke-opacity=".0"><animate attributeName="stroke-opacity" dur="4s" repeatCount="indefinite" values="0;.45;0"/></rect><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.6" fill="#000" fill-opacity=".14"/></pattern></defs><rect width="408" height="310" fill="url(#scan)"/></svg>